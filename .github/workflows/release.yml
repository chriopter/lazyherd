name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/build.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag against the plugin manifest
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml)
          test "v$manifest" = "${GITHUB_REF_NAME}" || { echo "herdr-plugin.toml says $manifest, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
